name: terraform

on:
  pull_request:
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Окружение"
        type: choice
        options: [dev, stage, prod]
        default: dev
      action:
        description: "Что делаем"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

env:
  TF_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  TF_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'plan' }}
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "true"
  WORKDIR: Task2Advanced/infra

# два запуска на одно окружение одновременно не идут, чтобы не побить стейт
concurrency:
  group: terraform-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: sa key
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' > "$RUNNER_TEMP/sa-key.json"
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$RUNNER_TEMP/sa-key.json" >> "$GITHUB_ENV"

      - name: fmt
        run: terraform fmt -check -recursive ..

      - name: init
        run: terraform init -input=false -backend-config="key=envs/${TF_ENV}/terraform.tfstate"

      - name: validate
        run: terraform validate

      - name: plan
        run: |
          if [ "$TF_ACTION" = "destroy" ]; then
            terraform plan -input=false -destroy -var-file="envs/${TF_ENV}.tfvars" -out=tfplan
          else
            terraform plan -input=false -var-file="envs/${TF_ENV}.tfvars" -out=tfplan
          fi

      - name: upload plan
        if: env.TF_ACTION != 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENV }}
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 1

      - name: cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/sa-key.json"

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'
    runs-on: ubuntu-latest
    # тут github ждет подтверждения от ревьюера окружения
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: sa key
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' > "$RUNNER_TEMP/sa-key.json"
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$RUNNER_TEMP/sa-key.json" >> "$GITHUB_ENV"

      - name: init
        run: terraform init -input=false -backend-config="key=envs/${TF_ENV}/terraform.tfstate"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENV }}
          path: ${{ env.WORKDIR }}

      - name: apply
        run: terraform apply -input=false tfplan

      - name: output
        if: env.TF_ACTION == 'apply'
        run: terraform output

      - name: cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/sa-key.json"
